<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>야외 주차장 차량 등록</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <h2 class="text-center mb-4">야외 주차장 차량 등록</h2>

    <div class="card shadow p-4">
      <div class="mb-3">
        <label class="form-label">이용기관(예약번호)
        </label>
        <input type="text" class="form-control" id="reservationNumber" readonly value="신협경기본부">
      </div>

      <div class="mb-3">
        <label class="form-label">주차 시작일 (yyyymmdd)</label>
        <input type="text" class="form-control" id="startDate" readonly value="20250326">
      </div>

      <div class="mb-3">
        <label class="form-label">주차 종료일 (yyyymmdd)</label>
        <input type="text" class="form-control" id="endDate" readonly value="20250327">
      </div>

      <div class="mb-3">
        <label class="form-label">차량 번호</label>
        <input type="text" class="form-control" id="carNumber" placeholder="예) 12가1234">
      </div>

      <button class="btn btn-primary w-100" id="registerButton" onclick="registerCar()">등록</button>
    </div>

    <h5 class="mt-5">🚗등록된 차량 리스트</h5>
<table class="table table-striped table-bordered mt-2 text-center">
  <thead class="table-dark">
    <tr>
      <th>📆등록일시</th>
      <th>🚗차량번호</th>
      <th>⛔삭제하기</th>
    </tr>
  </thead>
  <tbody id="carList"></tbody>
</table>

<script>
    const carList = document.getElementById('carList');
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwna9qs92sMb6zMbrlNIwD79UmXZjFN_CMjNkIA8RcOWMm58-LFbCkbSxw-SNQcXPWm/exec";
  
    // ✅ 페이지 로드시 서버에서 차량 목록 불러오기
    window.onload = function () {
  fetch(WEB_APP_URL)
    .then(response => response.json())
    .then(data => {
      carList.innerHTML = ''; // 테이블 초기화
      // ✅ 시트에서 읽은 순서를 최신순으로 뒤집음 (이게 핵심!)
      data.reverse().forEach(car => {
        addCarToList(car.time, car.carNumber);
      });
    })
    .catch(err => console.error("불러오기 실패:", err));
};
  
    // ✅ 차량 등록
    function registerCar(event) {
  event.preventDefault(); // 폼의 기본 제출 방지

  const registerButton = document.getElementById('registerButton');
  registerButton.disabled = true; // 버튼 비활성화
  const originalText = registerButton.innerHTML;
  registerButton.innerHTML = '📤등록중...'; // 버튼 텍스트 변경

  // 입력 값 가져오기
  const reservationNumber = document.getElementById('reservationNumber').value;
  const startDate = document.getElementById('startDate').value;
  const endDate = document.getElementById('endDate').value;
  const carNumber = document.getElementById('carNumber').value.trim();

  if (!carNumber) {
    alert("차량 번호를 입력하세요.");
    resetRegisterButton();
    return;
  }

  const data = { reservationNumber, carNumber, startDate, endDate };

  fetch(WEB_APP_URL, {
    method: "POST",
    mode: "no-cors",
    body: JSON.stringify(data),
    headers: { "Content-Type": "application/json" },
  })
  .then(() => {
    alert("차량이 등록되었습니다!");
    document.getElementById('carNumber').value = '';
    window.onload(); // 등록 후 목록 다시 불러오기
  })
  .catch(err => alert("등록 실패: " + err))
  .finally(() => resetRegisterButton());

  function resetRegisterButton() {
    registerButton.disabled = false; // 버튼 활성화
    registerButton.innerHTML = originalText; // 버튼 텍스트 복원
  }
} 
    // 등록일시 및 차량번호 표시 및 삭제하기버튼추가
function addCarToList(time, carNumber) {
  const localTime = new Date(time).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' });
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>${localTime}</td>
    <td>${carNumber}</td>
    <td><button class="btn btn-danger btn-sm" onclick="deleteCar('${time}', '${carNumber}', this)">삭제</button></td>
  `;
  carList.append(tr);
}

//삭제하기 기능추가
function deleteCar(time, carNumber, btn) {
  if (!confirm("해당 차량을 삭제하시겠습니까?")) return;

  const originalText = btn.innerHTML;
  btn.disabled = true; // 버튼 비활성화
  btn.innerHTML = '🔂삭제중...'; // 버튼 텍스트 변경

  // 서버 시간 포맷과 맞춰 변환
  const formattedTime = new Date(time).toLocaleString('sv-SE').replace('T', ' ');

  fetch(WEB_APP_URL, {
    method: "POST",
    mode: "no-CORS",
    body: JSON.stringify({ time: formattedTime, carNumber, action: 'delete' }),
    headers: { "Content-Type": "application/json" },
  })
  .then(() => {
    btn.closest('tr').remove(); // 화면에서도 삭제
    alert("삭제되었습니다.");
  })
  .catch(err => {
    alert("삭제 실패: " + err);
    btn.disabled = false; // 버튼 활성화
    btn.innerHTML = originalText; // 버튼 텍스트 복원
  });
}

  </script>
 
</body>
</html>
