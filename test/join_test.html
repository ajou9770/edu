<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>신청서</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
  <h3 class="mb-4">📋 신청서</h3>
  <form id="applyForm" class="card p-3 shadow-sm">
    <div class="mb-3">
      <label class="form-label">성명</label>
      <input type="text" class="form-control" name="name" required>
    </div>

    <div class="mb-3">
      <label class="form-label">연락처</label>
      <input type="tel" class="form-control" name="contact" placeholder="010-1234-5678" required>
    </div>

    <div class="mb-3">
      <label class="form-label">동반자</label>
      <input type="text" class="form-control" name="companion">
    </div>

    <div class="mb-3">
      <label class="form-label">선택지점</label>
      <select class="form-select" name="branch" required>
        <option value="">-- 선택 --</option>
        <option>서울점</option>
        <option>부산점</option>
        <option>대구점</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">기타 메모</label>
      <textarea class="form-control" name="comment" rows="3"></textarea>
    </div>

    <button type="submit" class="btn btn-primary w-100">신청하기</button>
  </form>

  <div id="result" class="mt-3"></div>
</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbwssO5iaWL6CFXbOinohhmvxHU61I4FXg5GMjbewnq9ktK8tQvs5CgyfLhKfy9-EjrcvA/exec"; // GAS 배포 URL

document.getElementById("applyForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const formData = new FormData(this);
  const data = Object.fromEntries(formData.entries());

  try {
    const res = await fetch(scriptURL, {
      method: "POST",
      body: JSON.stringify(data)
    });
    const result = await res.json();

    if (result.status === "success") {
      document.getElementById("result").innerHTML =
        `<div class="alert alert-success">✅ 신청이 완료되었습니다.</div>`;
      this.reset();
    } else {
      document.getElementById("result").innerHTML =
        `<div class="alert alert-danger">❌ 오류: ${result.message}</div>`;
    }
  } catch (err) {
    document.getElementById("result").innerHTML =
      `<div class="alert alert-danger">⚠ 네트워크 오류: ${err}</div>`;
  }
});
</script>

</body>
</html>
