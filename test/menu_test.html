<!DOCTYPE html>
<html lang="ko">
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <title>🎉온라인비대면 정보 및 서류수집업무역량강화 TEST</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <body
  >
    <div class="container mt-5">
      <h5>📌온라인 비대면 실명인증,개인정보동의 및 서류제출 관련 업무역량 테스트</h5>
      <br>
      <span>🤷🏽‍♀️ 아래 제출자를 선택 후 시작하기로 시작하세요 10분(600초)내 제출요망</span>
      <hr>
      <select id="name" class="form-control mt-3" required>
        <option value="">✔️제출자(직원) 선택</option>
        <option value="김기헌">김기헌</option>
        <option value="이정민">이정민</option>
        <option value="이연주">이연주</option>
        <option value="한진희">한진희</option>
        <!-- <option value="테스트">테스트</option> -->
      </select>
      <br>
      <button type="button" id="startBtn" class="btn btn-info btn-sm">⏰시작 하기</button>
      <hr>
      <form id="quizForm" style="display:none;">
        <div id="quiz"></div>
        <br>
        <button type="button" id="submitButton" class="btn btn-primary btn-block" onclick="submitForm()" disabled>📝제출 하기</button>
      </form>
      <div id="timer" style="position: fixed; bottom: 40px; right: 10px; font-size: 18px; background-color: bisque; color: red;"></div>
    </div>
    <!-- 종료 메시지 -->
    <div id="endMessage" style="display:none; text-align:center; margin-top:20px;">
      <h4>⏰시험 시간이 종료되었습니다</h4>
  </div>
    <script>
      document.getElementById('startBtn').addEventListener('click', function() {
  const nameSelect = document.getElementById('name');
  if (nameSelect.value === '') {
    alert('⚠️먼저 상단의 제출자(직원)을 선택해주세요.');
    return;
  }

  if (confirm('⏰17시 20분까지 10분[600초]의 시간이 주어집니다. 주어진 시간내 모든 답안을 체크 후 제출하세요. 시작하시겠습니까?')) {
    document.getElementById('quizForm').style.display = 'block';
    document.getElementById('timer').style.display = 'block';
    document.getElementById('submitButton').disabled = false;
    startTimer(600); // 타이머: 10분(600초)
  }
});


      const questions = [
        { question: "1.온라인 서류제출중 직접제출과 관련이없는 항목은?", options: ["모바일웹조합업무지원", "파일선택제출", "자동서류제출", "사진촬영제출"], answer: "자동서류제출" },
        { question: "2.모바일웹조합업무지원에서 제공하지 않는 업무는?", options: ["주민등록등.초본", "개인신용정보조회동의서", "가족관계증명서", "직접서류제출"], answer: "개인신용정보조회동의서" },
        { question: "3.공공마이데이터조회(여신관련)와 관련이 없는 항목은?", options: ["공공정보데이타API", "소득금액증명", "가족관계증명서", "주민등록등본"], answer: "가족관계증명서"},
        { question: "4.대출상담문의 또는 대출만기 재대출시 필요한 개인신용정보조회를 위해 이용하는 메뉴는?", options: ["모바일웹조합업무지원", "장표수집서류제출요청", "공공마이데이타조회", "공공마이데이타이력조회"], answer: "장표수집서류제출요청" },
        { question: "5.조합원 경조금 신청시 증빙서류를 제출 받을 수 있는 업무메뉴는?", options: ["장표수집서류제출요청", "모바일웹조합업무지원", "공공마이데이타조회", "온라인서류자동제출"], answer: "모바일웹조합업무지원" },
        { question: "6.다음중 모바일웹업무지원의 온라인서류제출중 자동서류 제출리스트가 아닌것은?", options: ["주민등록등.초본", "가족관계증명서", "소득금액증명원", "착오송금반환동의서"], answer: "착오송금반환동의서" },
        { question: "7.온라인서류제출 및 장표수집서류제출을 통해 기대하는 효과가 아닌것은?", options: ["여수신 비대면 온라인상담", "조합원의 이용편의증대", "여수신업무 효율성증대", "조합원의 접근성제한"], answer: "조합원의 접근성제한"},
        { question: "8.온라인 서류제출시 민간(간편)인증서만 사용 가능한가요?", options: ["예", "아니오", "잘모름"], answer: "아니오" },
        { question: "9.비대면 실명 인증시 모바일신분증(운전면허증)이 인증수단으로 가능한가요?", options: ["예", "아니오", "잘모름"], answer: "예"},
        { question: "10.모바일회비/헌금계좌에 입금(이체)를 위한 인증수단은?", options: ["휴대폰본인인증", "민간(금융)인증서", "PIN번호(생체인증)등 간편인증", "은행공인인증서"], answer: "휴대폰본인인증" }
    ];
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          let j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

function submitForm() {
  const name = document.getElementById('name').value;
  const submitButton = document.getElementById('submitButton');

  if (!document.getElementById('quizForm').checkValidity() || name === '') {
    alert('⚠️ 한개 이상의 답안이 누락 되었거나, 제출자를 선택하지 않았어요');
    return false;
  }

  if (confirm('답안을 제출하시겠습니까? 처음 제출한 답안만 유효합니다.')) {
    const correctAnswers = checkAnswers();
    alert(`✔️${questions.length}문제중  ${correctAnswers}개의 정답이 제출 됩니다. \n 잠시만 기다려 주세요..`);

    // 제출 버튼을 로딩 상태로 변경하고 비활성화
    submitButton.disabled = true;
    submitButton.innerText = '🔄제출중....';

    // 전체 답변이 상당하면 서버로 데이터를 전송
    let formData = {
      name: name,
    };

    questions.forEach((item, index) => {
      formData[`question${index}`] = document.querySelector(`input[name="question${index}"]:checked`).value;
    });

    fetch("https://script.google.com/macros/s/AKfycby8qLKuQ2lyGMGR15fTixbz1gM587LN_AH7fuZ4Ni-wJaMlF_51QGIGadiRDIJTJnz3iA/exec", {
      method: 'POST',
      mode:"no-cors",
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(formData)
    })
    .then(response => response.text())
    .then(data => {
      alert('🎉답안 제출이 완료 됩니다. 수고하셨습니다.');
      submitButton.disabled = false;
      submitButton.innerText = '📝제출 하기';
      document.getElementById('timer').style.display = 'none';
      document.getElementById('quizForm').style.display = 'none';
      document.getElementById('submitButton').disabled = true;
      setTimeout(function() {
        document.getElementById('quizForm').reset();
      }, 2000);
    })
    .catch(error => {
      alert('제출 중 오류가 발생했습니다. 다시 시도해 주세요.');
      submitButton.disabled = false;
      submitButton.innerText = '✔️제출 하기';
    });
  }
}


      function checkAnswers() {
        let correctCount = 0;
        questions.forEach((item, index) => {
          const radios = document.getElementsByName(`question${index}`);
          radios.forEach(radio => {
            if (radio.checked && radio.value === item.answer) {
              correctCount++;
            }
          });
        });
        return correctCount;
      }

     // 종료 시간 설정
const endDateTime = new Date('2024-12-03T10:40:00'); // 종료 시간 설정필요
const warningTime = new Date(endDateTime.getTime() - 1 * 60 * 1000); // 종료 1분 전

let warningShown = false; // 경고 메시지가 표시되었는지 확인
let endAlertShown = false; // 종료 메시지가 표시되었는지 확인

function checkTime() {
    const now = new Date(); // 현재 시간 가져오기
    const quizForm = document.getElementById('quizForm');

    // 종료 1분 전 경고 메시지 표시
    if (now >= warningTime && now < endDateTime && !warningShown) {
        warningShown = true; // 경고 메시지가 한 번만 표시되도록 설정
        alert("⏰시험 종료 시간이 1분 남았습니다. 답안을 제출해 주세요");
    }

    // 종료 시간이 지나면 종료 메시지 표시 및 폼 숨기기
    if (now >= endDateTime && !endAlertShown) {
        endAlertShown = true; // 종료 메시지가 한 번만 표시되도록 설정
        alert("⏰시험 시간이 종료되었습니다");
        if (quizForm) {
            quizForm.style.display = "none"; // 폼 숨기기
            document.getElementById('submitButton').disabled = true; // 제출 버튼 비활성화
        }
        // 종료 후에는 더 이상 반복하지 않도록 타이머 해제
        clearInterval(timer);
    }
}

// 페이지 로드 시와 매초마다 시간 확인
document.addEventListener('DOMContentLoaded', () => {
    // setInterval로 타이머를 설정하고, 이를 clear하기 위해 변수에 할당
    const timer = setInterval(checkTime, 1000); // 1초마다 확인
});

// 타이머 시작 함수
function startTimer(duration) {
    // 종료 시간이 지났는지 확인
    const now = new Date();
    if (now >= endDateTime) {
        alert("⚠️ 시험 시간이 이미 종료되었습니다. 더 이상 답안을 작성할 수 없습니다.");
        document.getElementById('quizForm').style.display = 'none';
        return;
    }

    let timer = duration;
    const timerDisplay = document.getElementById('timer');
    timerDisplay.innerHTML = `⏰남은시간: ${timer}초`;

    const interval = setInterval(function () {
        timer--;
        timerDisplay.innerHTML = `⏰남은시간: ${timer}초`;

        if (timer <= 0) {
            clearInterval(interval);
            document.getElementById('quizForm').style.display = 'none';
            document.getElementById('submitButton').disabled = true;
            document.getElementById('quizForm').reset();
            alert('⚠️ 시간이 종료되었습니다. 제출이 불가합니다.');
        }
    }, 1000);
}

      window.onload = function() {
        const quizDiv = document.getElementById('quiz');
        questions.forEach((item, index) => {
          const questionDiv = document.createElement('div');
          questionDiv.className = 'mb-3';
          questionDiv.innerHTML = `<label><b>${item.question}</b></label>`;
          shuffle(item.options).forEach(option => {
            const optionLabel = document.createElement('label');
            optionLabel.className = 'd-block';
            const radioButton = document.createElement('input');
            radioButton.type = 'radio';
            radioButton.name = `question${index}`;
            radioButton.value = option;
            radioButton.required = true;
            optionLabel.appendChild(radioButton);
            optionLabel.innerHTML += ` ${option}`;
            questionDiv.appendChild(optionLabel);
          });
          quizDiv.appendChild(questionDiv);
        });
      };

      document.addEventListener('contextmenu', function(e) {
        alert('⚠️우측 마우스버튼 사용이 제한됩니다.');
        e.preventDefault();
      });
    </script>
  </body>
</html>
