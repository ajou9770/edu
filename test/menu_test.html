<!DOCTYPE html>
<html lang="ko">
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <title>🎉온라인비대면 정보 및 서류수집업무역량강화 TEST</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <body>
    <div class="container mt-5">
      <h5>📌온라인 비대면 실명인증,개인정보동의 및 서류제출 관련 업무역량 테스트</h5>
      <br>
      <span>🤷🏽‍♀️ 아래 제출자를 선택 후 시작하기로 시작하세요 10분(600초)내 제출요망</span>
      <hr>
      <select id="name" class="form-control mt-3" required>
        <option value="">✔️제출자(직원) 선택</option>
        <option value="김기헌">김기헌</option>
        <option value="이정민">이정민</option>
        <option value="이연주">이연주</option>
        <option value="한진희">한진희</option>
        <option value="테스트">테스트</option>
      </select>
      <br>
      <button type="button" id="startBtn" class="btn btn-info btn-sm">⏰시작 하기</button>
      <hr>
      <form id="quizForm" style="display:none;">
        <div id="quiz"></div>
        <br>
        <button type="button" id="submitButton" class="btn btn-primary btn-block" onclick="submitForm()" disabled>📝제출 하기</button>
      </form>
      <div id="timer" style="position: fixed; bottom: 40px; right: 10px; font-size: 18px; background-color: bisque; color: red;"></div>
    </div>

    <script>
      document.getElementById('startBtn').addEventListener('click', function() {
  const nameSelect = document.getElementById('name');
  if (nameSelect.value === '') {
    alert('⚠️먼저 상단의 제출자(직원)을 선택해주세요.');
    return;
  }

  if (confirm('⏰10분[600초]의 시간이 주어집니다. 주어진 시간내 모든 답안을 체크 후 제출하세요. 시작하시겠습니까?')) {
    document.getElementById('quizForm').style.display = 'block';
    document.getElementById('timer').style.display = 'block';
    document.getElementById('submitButton').disabled = false;
    startTimer(600);
  }
});


      const questions = [
        { question: "1.장표수집서류제출요청화면에서 제공하지 않는 업무는?", options: ["출자금핵심설명", "개인(신용)정보수집이용제공동의", "미성년자예금계좌개설동의", "비대면실명인증"], answer: "비대면실명인증" },
        { question: "2.모바일웹조합업무지원 및 장표수집서류제출요청은 조합원만 가능한가요?", options: ["예", "아니오", "모르겠음"], answer: "아니오" },
        { question: "3.비대면실명인증이 가능한 업무메뉴는??", options: ["모바일웹조합업무지원", "장표수집서류제출요청", "공공마이데이타조회", "공공마이데이타이력조회"], answer: "모바일웹조합업무지원"},
        { question: "4.비대면실명인증에 필요한 서류가 아닌것은?", options: ["본인명의휴대폰", "신분증(주민등록증또는 운전면허증)", "본인계좌", "민간(간편)인증서"], answer: "민간(간편)인증서" },
        { question: "5.다음중 모바일웹업무지원에서 전송할 수 없는 업무는?", options: ["비대면실명인증", "SRC", "카드회원정보변경", "온라인서류제출"], answer: "SRC" },
        { question: "6.다음중 모바일웹업무지원의 온라인서류제출중 자동서류 제출리스트가 아닌것은?", options: ["주민등록등.초본", "가족관계증명서", "소득금액증명원", "착오송금반환동의서"], answer: "착오송금반환동의서" },
        { question: "7.다음중 근로자원천징수영수증과 동일한 증명효력이 있는 서류는?", options: ["건강보험자격득실확인서", "근로자소득금액증명원", "국세납세증명서", "건강보험료납부확인서"], answer: "근로자소득금액증명원"},
        { question: "8.현재 신협 온라인서류제출에서 필요한 민간(간편)인증서에 해당하지 않는 것은?", options: ["카카오톡", "네이버", "페이코", "신한인증서","삼성패스","토스","금융인증서"], answer: "금융인증서" },
        { question: "9.조합이 향후 여신관련 모바일웹업무지원을 이용할 경우에 필요서류에 포함되지 않는 서류는?", options: ["개인(신용)정보조회동의서", "근로자소득금액증명원", "납세증명원", "건강보험자격득실확인서"], answer: "납세증명원"},
        { question: "10.다음중 모바일회비/헌금계좌관리 업무에 대해 잘못 기술한 것은??", options: ["헌금/동호회비를 리온브런치를 통해 간편납부할 수 있음", "지정된관리자는 입출내역을 조회할 수 있음.", "온뱅크와 연결되어 관리되고 있음", "해당계좌등록시 납부URL및조회URL이 생성됨"], answer: "온뱅크와 연결되어 관리되고 있음" }
    ];
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          let j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

function submitForm() {
  const name = document.getElementById('name').value;
  const submitButton = document.getElementById('submitButton');

  if (!document.getElementById('quizForm').checkValidity() || name === '') {
    alert('⚠️ 한개 이상의 답안이 누락 되었습니다. 확인후 체크해 주세요');
    return false;
  }

  if (confirm('답안을 제출하시겠습니까? 처음 제출한 답안만 유효합니다.')) {
    const correctAnswers = checkAnswers();
    alert(`✔️${questions.length}문제중  ${correctAnswers}개의 정답이 제출 됩니다. \n 잠시만 기다려 주세요..`);

    // 제출 버튼을 로딩 상태로 변경하고 비활성화
    submitButton.disabled = true;
    submitButton.innerText = '🔄제출중....';

    // 전체 답변이 상당하면 서버로 데이터를 전송
    let formData = {
      name: name,
    };

    questions.forEach((item, index) => {
      formData[`question${index}`] = document.querySelector(`input[name="question${index}"]:checked`).value;
    });

    fetch("https://script.google.com/macros/s/AKfycby8qLKuQ2lyGMGR15fTixbz1gM587LN_AH7fuZ4Ni-wJaMlF_51QGIGadiRDIJTJnz3iA/exec", {
      method: 'POST',
      mode:"no-cors",
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(formData)
    })
    .then(response => response.text())
    .then(data => {
      alert('🎉답안 제출이 완료 됩니다. 수고하셨습니다.');
      submitButton.disabled = false;
      submitButton.innerText = '📝제출 하기';
      document.getElementById('timer').style.display = 'none';
      document.getElementById('quizForm').style.display = 'none';
      document.getElementById('submitButton').disabled = true;
      setTimeout(function() {
        document.getElementById('quizForm').reset();
      }, 2000);
    })
    .catch(error => {
      alert('제출 중 오류가 발생했습니다. 다시 시도해 주세요.');
      submitButton.disabled = false;
      submitButton.innerText = '✔️제출 하기';
    });
  }
}


      function checkAnswers() {
        let correctCount = 0;
        questions.forEach((item, index) => {
          const radios = document.getElementsByName(`question${index}`);
          radios.forEach(radio => {
            if (radio.checked && radio.value === item.answer) {
              correctCount++;
            }
          });
        });
        return correctCount;
      }

      function startTimer(duration) {
        let timer = duration;
        const timerDisplay = document.getElementById('timer');
        timerDisplay.innerHTML = `⏰남은시간: ${timer}초`;

        const interval = setInterval(function () {
          timer--;
          timerDisplay.innerHTML = `⏰남은시간: ${timer}초`;

          if (timer <= 0) {
            clearInterval(interval);
            document.getElementById('quizForm').style.display = 'none';
            document.getElementById('submitButton').disabled = true;
            alert('⚠️ 시간이 종료되었습니다. 제출이 불가합니다.');
          }
        }, 1000);
      }

      window.onload = function() {
        const quizDiv = document.getElementById('quiz');
        questions.forEach((item, index) => {
          const questionDiv = document.createElement('div');
          questionDiv.className = 'mb-3';
          questionDiv.innerHTML = `<label><b>${item.question}</b></label>`;
          shuffle(item.options).forEach(option => {
            const optionLabel = document.createElement('label');
            optionLabel.className = 'd-block';
            const radioButton = document.createElement('input');
            radioButton.type = 'radio';
            radioButton.name = `question${index}`;
            radioButton.value = option;
            radioButton.required = true;
            optionLabel.appendChild(radioButton);
            optionLabel.innerHTML += ` ${option}`;
            questionDiv.appendChild(optionLabel);
          });
          quizDiv.appendChild(questionDiv);
        });
      };

      document.addEventListener('contextmenu', function(e) {
        alert('⚠️우측 마우스버튼 사용이 제한됩니다.');
        e.preventDefault();
      });
    </script>
  </body>
</html>
