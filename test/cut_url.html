<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .card {
      border-radius: 1.5rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .btn-primary {
      border-radius: 50px;
      padding: 0.75rem 1.5rem;
    }
    .btn-secondary {
      border-radius: 50px;
      padding: 0.5rem 1rem;
      margin-top: 10px;
    }
    .short-url {
      font-size: 1.2rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4">
          <h3 class="text-center mb-4">🔗 URL 단축하기</h3>
          <div class="mb-3">
            <input type="text" class="form-control" id="longUrl" placeholder="단축할 URL 을 붙여 넣으세요">
          </div>
          <div class="d-grid">
            <button class="btn btn-primary" onclick="shortenUrl()">✔️URL 단축생성</button>
          </div>
          <div class="mt-4 text-center">
            <p class="short-url text-success" id="shortenedUrl"></p>
            <button class="btn btn-secondary d-none" id="copyBtn" onclick="copyToClipboard()">📋 Copy Short URL</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('longUrl').addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        shortenUrl();
      }
    });

    async function shortenUrl() {
      const longUrl = document.getElementById('longUrl').value.trim();
      const resultEl = document.getElementById('shortenedUrl');
      const copyBtn = document.getElementById('copyBtn');

      if (!longUrl) {
        resultEl.innerHTML = '<span class="text-danger">Please enter a valid URL.</span>';
        copyBtn.classList.add('d-none');
        return;
      }

      try {
        const response = await fetch('https://api-ssl.bitly.com/v4/shorten', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer 6cd23896c371f1f2fea588ecf8c2bf1cd5b32ebe',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ long_url: longUrl })
        });

        if (!response.ok) {
          throw new Error('Failed to shorten the URL');
        }

        const data = await response.json();
        resultEl.innerHTML = `<a href="${data.link}" target="_blank">${data.link}</a>`;
        resultEl.setAttribute('data-url', data.link);
        copyBtn.classList.remove('d-none');
      } catch (error) {
        console.error(error);
        resultEl.innerHTML = '<span class="text-danger">Error shortening the URL. Please try again.</span>';
        copyBtn.classList.add('d-none');
      }
    }

    function copyToClipboard() {
      const url = document.getElementById('shortenedUrl').getAttribute('data-url');
      if (url) {
        navigator.clipboard.writeText(url).then(() => {
          alert('✅ 단축된 URL 이 복사되었습니다.!');
        }, () => {
          alert('❌ Failed to copy.');
        });
      }
    }
  </script>
</body>
</html>
