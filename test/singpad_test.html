<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>정보 제출 폼</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.5/dist/signature_pad.umd.min.js"></script>
  <style>
    body {
      background-color: #f8f9fa;
    }
    .container {
      max-width: 600px;
      margin-top: 50px;
      padding: 30px;
      background-color: white;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    #signature-pad {
      border: 1px solid #ced4da;
      border-radius: 5px;
    }
    canvas {
      width: 100%;
      height: 200px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3 class="mb-4 text-center">정보 제출 폼</h3>
    <form id="submitForm">
      <div class="mb-3">
        <label for="employeeId" class="form-label">사번</label>
        <input type="text" class="form-control" id="employeeId" required>
      </div>
      <div class="mb-3">
        <label for="name" class="form-label">성명</label>
        <input type="text" class="form-control" id="name" required>
      </div>
      <div class="mb-3">
        <label for="contact" class="form-label">연락처</label>
        <input type="tel" class="form-control" id="contact" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">이메일</label>
        <input type="email" class="form-control" id="email">
      </div>
      <div class="mb-3">
        <label class="form-label">서명</label>
        <div id="signature-pad">
          <canvas></canvas>
        </div>
        <button type="button" class="btn btn-secondary btn-sm mt-2" id="clear-signature">서명 지우기</button>
      </div>
      <button type="submit" class="btn btn-primary w-100">제출</button>
      <div class="alert mt-3 d-none" id="statusMessage"></div>
    </form>
  </div>

  <script>
  const canvas = document.querySelector("canvas");
const signaturePad = new SignaturePad(canvas);

document.getElementById("clear-signature").addEventListener("click", () => {
  signaturePad.clear();
});

document.getElementById("submitForm").addEventListener("submit", async function (e) {
  e.preventDefault();

  const statusEl = document.getElementById("statusMessage");
  statusEl.classList.add("d-none");

  if (signaturePad.isEmpty()) {
    alert("서명을 입력해주세요.");
    return;
  }

  const employeeId = document.getElementById("employeeId").value.trim();
  const name = document.getElementById("name").value.trim();
  const contact = document.getElementById("contact").value.trim();
  const email = document.getElementById("email").value.trim();
  const sign = signaturePad.toDataURL();

  const formData = new URLSearchParams();
  formData.append("employeeId", employeeId);
  formData.append("name", name);
  formData.append("contact", contact);
  formData.append("email", email);
  formData.append("sign", sign);

  try {
    const response = await fetch("https://script.google.com/macros/s/AKfycbzIKwQCwZfP20FMAGbZE5O8iDXgq-EaqXB-4kOQ2Y58itH9kWCuXmKsc3vR4GmV8t-U/exec", {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: formData
    });

    const text = await response.text();
    console.log("서버 응답:", text);

    let result;
    try {
      result = JSON.parse(text);
    } catch (jsonErr) {
      console.error("서버 응답 JSON 파싱 실패:", text);
      throw new Error("서버 응답이 JSON 형식이 아닙니다.");
    }

    if (result.result === "success") {
      statusEl.className = "alert alert-success";
      statusEl.textContent = "제출이 완료되었습니다!";
      statusEl.classList.remove("d-none");
      document.getElementById("submitForm").reset();
      signaturePad.clear();
    } else {
      throw new Error("서버가 성공 상태를 반환하지 않았습니다.");
    }
  } catch (err) {
    statusEl.className = "alert alert-danger";
    statusEl.textContent = "제출에 실패했습니다. 다시 시도해주세요.";
    statusEl.classList.remove("d-none");
    console.error("제출 오류:", err);
  }
});
  </script
</body>
</html>
