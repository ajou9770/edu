<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>💵외부자금유치분석보고고</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    input::placeholder { color: #bbb; }

    /* PDF 출력 영역 스타일 */
    #pdfContent {
      width: 210mm;
      padding: 20px;
      font-size: 12pt;
      line-height: 1.6;
      page-break-inside: avoid;
      word-break: keep-all;
    }

    #pdfContent .list-group-item {
      padding: 6px 12px;
      border: 1px solid #ddd;
    }

    @media print {
      body { -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body class="bg-light p-4">
  <div class="container">
    <h3 class="mb-4">💱외부유지자금 운용수익분석보고</h3>

    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">💵예치 예정액 (단위:천원)</label>
        <input type="text" id="principal" class="form-control" placeholder="예: 1,000,000 (=> 10억원)">
      </div>
      <div class="col-md-6">
        <label class="form-label">🚩의무상준금 이율 (%)</label>
        <input type="number" id="reserveRate" class="form-control" step="0.01">
      </div>
      <div class="col-md-6">
        <label class="form-label">✔️지급이자율 (%)</label>
        <input type="number" id="payRate" class="form-control" step="0.01">
      </div>
      <div class="col-md-6">
        <label class="form-label">💱운영금리 (%)</label>
        <input type="number" id="operationRate" class="form-control" step="0.01">
      </div>
      <div class="col-md-6">
        <label class="form-label">📅예치기간 (개월)</label>
        <input type="number" id="period" class="form-control">
      </div>
    </div>

    <button class="btn btn-primary mt-4" onclick="calculate()">📊 분석 하기</button>
    <div class="mt-4" id="resultArea"></div>
    <!-- <div class="mt-3 d-none" id="pdfArea">
      <button class="btn btn-outline-secondary" onclick="downloadPDF()">📄 PDF로 저장하기</button>
    </div> -->
  </div>

  <script>
    // 쉼표 자동 입력
    document.getElementById("principal").addEventListener("input", function () {
      let value = this.value.replace(/[^0-9]/g, '');
      if (value) {
        this.value = parseInt(value).toLocaleString();
      } else {
        this.value = '';
      }
    });

    function calculate() {
      const today = new Date().toISOString().split('T')[0];
      const principalRaw = document.getElementById("principal").value.replace(/,/g, '');
      const principal = parseFloat(principalRaw) * 1000; // 천원 단위 → 원
      const reserveRate = parseFloat(document.getElementById("reserveRate").value);
      const payRate = parseFloat(document.getElementById("payRate").value);
      const operationRate = parseFloat(document.getElementById("operationRate").value);
      const period = parseFloat(document.getElementById("period").value);

      if (isNaN(principal) || isNaN(reserveRate) || isNaN(payRate) || isNaN(operationRate) || isNaN(period)) {
        alert("모든 항목을 입력해 주세요.");
        return;
      }

      const reserve = principal * 0.1;
      const operationFund = principal * 0.9;

      const reserveIncome = reserve * (reserveRate / 100) * (period / 12);
      const operationIncome = operationFund * (operationRate / 100) * (period / 12);
      const totalIncome = reserveIncome + operationIncome;

      const paidInterest = principal * (payRate / 100) * (period / 12);
      const fundFee = principal * 0.001;
      const totalCost = paidInterest + fundFee;

      const netProfit = totalIncome - totalCost;

      const reportHtml = `
        <div id="pdfContent" class="card p-4 shadow-sm">
          <h5 class="mb-3">📌 아주대의료원신협 - 이자차익 분석 보고서</h5>
          <p><strong>🗓️ 기준일: ${today}</strong></p>

          <h6 class="mt-4">✅ 입력 요약</h6>
          <ul class="list-group mb-4">
            <li class="list-group-item">예치금액: <strong>${(principal / 1000).toLocaleString()}천원</strong></li>
            <li class="list-group-item">의무상준금 이율: <strong>${reserveRate}%</strong></li>
            <li class="list-group-item">지급이자율: <strong>${payRate}%</strong></li>
            <li class="list-group-item">운영금리: <strong>${operationRate}%</strong></li>
            <li class="list-group-item">예치기간: <strong>${period}개월</strong></li>
          </ul>

          <h6 class="mt-3">📊 계산 결과</h6>
          <ul class="list-group">
            <li class="list-group-item">📌 의무상준금 (10%): <strong>${reserve.toLocaleString()}원</strong></li>
            <li class="list-group-item">📌 운용자금 (90%): <strong>${operationFund.toLocaleString()}원</strong></li>
            <li class="list-group-item">💸 의무상준금 수익: <strong>${reserveIncome.toLocaleString()}원</strong></li>
            <li class="list-group-item">📈 운용수익: <strong>${operationIncome.toLocaleString()}원</strong></li>
            <li class="list-group-item bg-light">✅ 총수익: <strong>${totalIncome.toLocaleString()}원</strong></li>
            <li class="list-group-item">💰 지급이자: <strong>${paidInterest.toLocaleString()}원</strong></li>
            <li class="list-group-item">🏦 예금보호기금 출연금: <strong>${fundFee.toLocaleString()}원</strong></li>
            <li class="list-group-item bg-light">💸 총비용: <strong>${totalCost.toLocaleString()}원</strong></li>
            <li class="list-group-item bg-success text-white">💡 <strong>순이자차익: ${netProfit.toLocaleString()}원</strong></li>
          </ul>
        </div>
      `;

      document.getElementById("resultArea").innerHTML = reportHtml;
      document.getElementById("pdfArea").classList.remove("d-none");
    }

    /* function downloadPDF() {
      const element = document.getElementById("pdfContent");
      html2pdf()
        .set({
          margin: 10,
          filename: '이자차익_보고서.pdf',
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
          pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        })
        .from(element)
        .save();
    } */
  </script>
</body>
</html>
